[package]
name = "hide-something"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.0"
description = "Hides arbitrary information into a text carrier by altering letter case"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/hide-something"
repository = "https://github.com/cherish-ltt/hide-something.git"
keywords = ["steganography", "hide", "case", "deflate"]
exclude = [".agents/**", ".codex/**", ".idea/**", "AGENTS.md"]

[dependencies]
flate2 = "=1.1.9"
thiserror = "=2.0.20"

[lib]
name = "hide_something"
path = "src/lib.rs"

[dev-dependencies]
criterion = { version = "=0.8.2", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false